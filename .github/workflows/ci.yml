name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile install.py runtime/vibe.py runtime/vibe_core.py runtime/vibe_stacks.py runtime/vibe_architecture.py runtime/vibe_state.py
      - name: Tests
        run: python -m unittest discover -s tests -v
